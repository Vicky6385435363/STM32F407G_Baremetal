<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box { fill:#1e293b; stroke:#38bdf8; stroke-width:2; rx:10; }
      .label { fill:#e2e8f0; font-size:14px; font-weight:600; }
      .sublabel { fill:#94a3b8; font-size:11px; }
      .arrow { stroke:#38bdf8; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="320" fill="#0f172a" />

  <text x="380" y="30" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700">
    ADC Single Conversion Cycle (Polling Mode)
  </text>

  <!-- Step 1: SWSTART -->
  <rect class="box" x="20" y="70" width="150" height="70" rx="10"/>
  <text class="label" x="95" y="98" text-anchor="middle">SWSTART = 1</text>
  <text class="sublabel" x="95" y="116" text-anchor="middle">CR2 bit 30 set</text>
  <circle id="startPulse" cx="95" cy="140" r="4" fill="#38bdf8">
    <animate attributeName="r" values="4;9;4" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <path class="arrow" d="M170,105 H230"/>

  <!-- Step 2: Polling loop -->
  <rect class="box" x="235" y="60" width="220" height="120" rx="10"/>
  <text class="label" x="345" y="85" text-anchor="middle">Poll EOC flag</text>
  <text class="sublabel" x="345" y="102" text-anchor="middle">while (!(ADC1_SR &amp; (1&lt;&lt;1)))</text>

  <!-- Progress bar filling = conversion happening -->
  <rect x="255" y="115" width="180" height="16" rx="8" fill="#0f172a" stroke="#475569"/>
  <rect x="257" y="117" width="0" height="12" rx="6" fill="#22c55e">
    <animate attributeName="width" values="0;176;0" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text class="sublabel" x="345" y="150" text-anchor="middle">sampling + successive approximation</text>

  <!-- EOC flag blinking -->
  <circle cx="345" cy="165" r="6" fill="#334155">
    <animate attributeName="fill" values="#334155;#334155;#22c55e;#334155" keyTimes="0;0.85;0.95;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="sublabel" x="365" y="169">EOC</text>

  <path class="arrow" d="M455,120 H520"/>

  <!-- Step 3: Read DR -->
  <rect class="box" x="525" y="70" width="200" height="80" rx="10"/>
  <text class="label" x="625" y="98" text-anchor="middle">Read ADC1_DR</text>
  <text class="sublabel" x="625" y="116" text-anchor="middle">value &amp; 0xFFF -&gt; 0-4095</text>
  <text class="sublabel" x="625" y="134" text-anchor="middle">(read also clears EOC)</text>

  <!-- Loop back arrow -->
  <path class="arrow" d="M625,150 C625,220 95,220 95,150" fill="none"/>
  <text class="sublabel" x="360" y="235" text-anchor="middle">next conversion (software delay, then loop)</text>

  <!-- Voltage -> digital value visualization -->
  <text class="label" x="380" y="270" text-anchor="middle" fill="#f1f5f9">Analog Input (PA1) → Digital Value</text>

  <line x1="60" y1="300" x2="700" y2="300" stroke="#475569" stroke-width="2"/>
  <circle cx="60" cy="300" r="5" fill="#f97316">
    <animate attributeName="cx" values="60;700;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="315" fill="#94a3b8" font-size="10">0V</text>
  <text x="690" y="315" fill="#94a3b8" font-size="10">3.3V</text>

  <text id="valText" x="380" y="292" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">
    0
    <animate attributeName="x" values="60;700;60" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
